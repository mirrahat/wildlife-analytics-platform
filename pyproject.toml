# Australian Wildlife Analytics Platform - Azure Configuration

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "australian-wildlife-analytics-platform"
version = "1.0.0"
description = "Enterprise-grade data lake solution for Australian biodiversity research"
authors = [
    {name = "Mir Hasibul Hasan Rahat", email = "your-email@domain.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.15.0",
    "requests>=2.31.0",
    "altair>=5.0.1",
    "scikit-learn>=1.3.0",
    "python-dateutil>=2.8.2",
    "pytz>=2023.3"
]

[project.urls]
Homepage = "https://github.com/mirrahat/wildlife-analytics-platform"
Repository = "https://github.com/mirrahat/wildlife-analytics-platform"